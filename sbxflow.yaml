version: 1

sandbox:
  name: sbxflow
  agent: codex

  network:
    allowedHosts:
      - www.bestpractices.dev
      - scorecard.dev
      - api.scorecard.dev
      - sonarcloud.io

  hooks:
    initialize:
      - command: [mise, trust, --yes, mise.toml]
      - command: [mise, run, setup]

  kits:
    sources:
      community:
        type: git
        repo: https://github.com/docker/sbx-kits-contrib.git
        ref: v0.16.0

      sbx-kits:
        type: git
        repo: https://github.com/jamessawle/sbx-kits.git
        ref: v2026.08.03

    use:
      - source: community
        kit: mise

      - source: sbx-kits
        kit: kits/harness/codex

      - source: sbx-kits
        kit: kits/mise/network-go

      - source: sbx-kits
        kit: kits/mise/network-node

      - source: sbx-kits
        kit: kits/mise/network-zig

version: 1

sandbox:
  name: personal-site
  agent: codex

  kits:
    sources:
      docker-contrib:
        type: git
        repo: https://github.com/docker/sbx-kits-contrib.git
        ref: v0.14.0

      personal:
        type: git
        repo: https://github.com/jamessawle/sbx-kits.git
        ref: v2026.08.02

    use:
      - source: docker-contrib
        kit: mise

      - source: personal
        kit: kits/language/node-npm

      - source: personal
        kit: kits/mise/network-go

      - source: personal
        kit: kits/mise/network-hugo

      - source: personal
        kit: kits/mise/network-node

      - source: personal
        kit: kits/mise/network-zig

      - source: personal
        kit: kits/harness/codex

min_version = "2026.5.2"

[tools]
actionlint = "1.7.12"
go = "1.26.5"
golangci-lint = "2.12.2"
"go:github.com/fe3dback/go-arch-lint" = "1.16.0"
node = "24.18.0"
"npm:@fission-ai/openspec" = "1.8.0"
"npm:prettier" = "3.9.6"

[tasks.setup]
description = "Install development tools and activate Git hooks"
run = '''
mise install

if git rev-parse --git-dir >/dev/null 2>&1; then
  git config core.hooksPath .githooks
  echo "Configured Git hooks from .githooks."
else
  echo "No Git repository found; Git hook activation skipped."
fi
'''

[tasks.fmt]
description = "Format project files"
run = '''
prettier --write "**/*.md"
gofmt -w .
'''

[tasks."test:architecture"]
description = "Check production package dependency boundaries"
run = "go-arch-lint check"

[tasks.validate]
description = "Run all repository checks"
run = '''
prettier --check "**/*.md"
actionlint
openspec validate --all --strict --no-interactive

unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "Go files need formatting:"
  echo "$unformatted"
  exit 1
fi

go vet ./...
golangci-lint run
go test ./...
mise run test:architecture
go build ./...
'''

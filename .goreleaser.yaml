version: 2

project_name: sbxflow

builds:
  - id: sbxflow-darwin
    main: ./cmd/sbxflow
    binary: sbxflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Version={{ .Tag }}
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Commit={{ .FullCommit }}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - id: sbxflow-other
    main: ./cmd/sbxflow
    binary: sbxflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Version={{ .Tag }}
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Commit={{ .FullCommit }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
archives:
  - id: sbxflow-darwin
    ids:
      - sbxflow-darwin
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  - id: sbxflow-other
    ids:
      - sbxflow-other
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - ids:
      - sbxflow-darwin
    repository:
      owner: jamessawle
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
    directory: Casks
    homepage: https://github.com/jamessawle/sbxflow
    description: Apply a repository's Docker Sandbox configuration and lifecycle
    license: MIT
    binaries:
      - sbxflow

changelog:
  use: github-native

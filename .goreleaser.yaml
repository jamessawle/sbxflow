version: 2

project_name: sbxflow

builds:
  - id: sbxflow
    main: ./cmd/sbxflow
    binary: sbxflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Version={{ .Tag }}
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: sbxflow
    ids:
      - sbxflow
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Published as a formula rather than a cask: GoReleaser's generated cask trips
# Cask/StanzaOrder and cannot declare `depends_on macos:`, so every release
# needed a corrective commit in the tap. The formula publisher is deprecated
# upstream; see the publish-homebrew-formula design note for the trade-off and
# the conditions under which a cask becomes viable again.
brews:
  - name: sbxflow
    repository:
      owner: jamessawle
      name: homebrew-tap
      branch: "sbxflow-{{ .Tag }}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Formula
    homepage: https://github.com/jamessawle/sbxflow
    description: Apply a repository's Docker Sandbox configuration and lifecycle
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(brew): sbxflow {{ .Tag }}"
    test: |
      system bin/"sbxflow", "--version"

changelog:
  use: github-native

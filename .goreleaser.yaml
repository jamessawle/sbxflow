version: 2

project_name: sbxflow

builds:
  - id: sbxflow
    main: ./cmd/sbxflow
    binary: sbxflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Version={{ .Tag }}
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Commit={{ .FullCommit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
archives:
  - id: sbxflow
    ids:
      - sbxflow
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - repository:
      owner: jamessawle
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/jamessawle/sbxflow
    description: Apply a repository's Docker Sandbox configuration and lifecycle
    license: MIT
    binaries:
      - sbxflow

changelog:
  disable: true

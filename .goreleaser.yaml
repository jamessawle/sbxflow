version: 2

project_name: sbxflow

builds:
  - id: sbxflow
    main: ./cmd/sbxflow
    binary: sbxflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Version={{ .Tag }}
        -X github.com/jamessawle/sbxflow/internal/ports/buildInfo.Commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: sbxflow
    ids:
      - sbxflow
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: sbxflow
    repository:
      owner: jamessawle
      name: homebrew-tap
      branch: "sbxflow-{{ .Tag }}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Casks
    homepage: https://github.com/jamessawle/sbxflow
    description: Apply a repository's Docker Sandbox configuration and lifecycle
    license: MIT
    binaries:
      - sbxflow
    # The Linux archives are deliberately included. Homebrew cannot install a
    # cask on Linux, but `brew readall --os=all --arch=all` rejects a cask that
    # resolves no checksum on a platform it evaluates, and GoReleaser has no
    # `depends_on macos:` support to declare the cask macOS-only instead.
    #
    # The postflight hook is GoReleaser's documented remedy for binaries that
    # are neither signed nor notarized. Without it macOS refuses to run the
    # installed executable.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sbxflow"]
          end

changelog:
  use: github-native

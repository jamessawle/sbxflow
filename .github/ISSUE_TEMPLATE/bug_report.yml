name: Bug report
description: Report reproducible behavior that is not working as documented
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve sbxflow. For security vulnerabilities, do not use this form; follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: sbxflow-version
    attributes:
      label: sbxflow version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: sbx-version
    attributes:
      label: Docker Sandboxes version
      description: Run `sbx version` if available.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal declaration and exact commands, removing secrets and private data.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste logs or diagnostics after removing secrets and private data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that could help diagnose the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or private information.
          required: true

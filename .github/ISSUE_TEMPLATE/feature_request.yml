name: Feature request
description: Suggest an improvement within sbxflow's documented scope
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For security vulnerabilities, follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible behavior and, where useful, an example command or declaration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant constraints, links, or examples without private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I reviewed the documented project scope in README.md.
          required: true

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "Release tag is not a canonical v-prefixed Semantic Version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            prerelease=${VERSION#*-}
            prerelease=${prerelease%%+*}
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != 0 ]]; then
                echo "Numeric prerelease identifiers cannot contain leading zeroes: $VERSION"
                exit 1
              fi
            done
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2 # Keep aligned with mise.toml min_version.

      - name: Validate repository
        run: mise run validate

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writes are limited to release publication and short-lived provenance.
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2 # Keep aligned with mise.toml min_version.
          install_args: go

      - name: Publish GitHub and Homebrew releases
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Normalize generated Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          branch="sbxflow-${version}"
          cask_path="Casks/sbxflow.rb"

          ./scripts/render-homebrew-cask.sh "${version}" dist/checksums.txt dist/sbxflow.rb

          cask_sha=$(gh api --method GET \
            "repos/jamessawle/homebrew-tap/contents/${cask_path}" \
            -f ref="${branch}" \
            --jq .sha)
          content=$(base64 -w 0 dist/sbxflow.rb)

          gh api --method PUT \
            "repos/jamessawle/homebrew-tap/contents/${cask_path}" \
            -f message="fix: normalize sbxflow ${version} cask" \
            -f content="${content}" \
            -f sha="${cask_sha}" \
            -f branch="${branch}" >/dev/null

      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Attach provenance to release
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${ATTESTATION_BUNDLE}" dist/sbxflow-provenance.intoto.jsonl
          gh release upload "${GITHUB_REF_NAME}" dist/sbxflow-provenance.intoto.jsonl
